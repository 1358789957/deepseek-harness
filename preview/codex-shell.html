      else if (name === 'review') { hideBarPops(); toggleReview() }
      else if (name === 'zoomin') { hideBarPops(); zoomBy(0.1) }
      else if (name === 'zoomout') { hideBarPops(); zoomBy(-0.1) }
      else if (name === 'zoomreset') { hideBarPops(); z = 1; applyZoom() }
      else if (name === 'max') { hideBarPops(); toggleMax() }
      else if (name === 'docs') openDocs()
      else if (name === 'keys') showKeys()
      else if (name === 'about') showAbout()
      else runEdit(name)
    }
    document.querySelectorAll('.bar-pop button').forEach(b => b.onclick = () => act(b.dataset.act))
    document.getElementById('btnSide').onclick = toggleSide
    document.getElementById('btnBack').onclick = () => { if (hi > 0) { hi--; apply(hist[hi]); paintNav() } }
    document.getElementById('btnFwd').onclick = () => { if (hi < hist.length - 1) { hi++; apply(hist[hi]); paintNav() } }
    document.getElementById('btnMin').onclick = minimize
    document.getElementById('btnMax').onclick = toggleMax
    document.getElementById('btnClose').onclick = closeWin
    document.getElementById('btnNew').onclick = newChat
    document.getElementById('btnReview').onclick = toggleReview
    document.getElementById('btnReviewX').onclick = hideReview

    const shead = document.getElementById('shead')
    const slabel = document.getElementById('slabel')
    const sessQ = document.getElementById('sessQ')
    const slist = document.getElementById('slist')
    const workspaces = [
      { id: 'shengchang', name: '声场', open: true },
      { id: 'ungrouped', name: '未分组', open: true },
    ]
    const sessions = [
      { id: 's1', ws: 'shengchang', title: '跳转轨交互', messages: [
        { role: 'user', text: '把跳转轨做成声场那样，悬停预览，点击跳到那一轮。' },
        { role: 'bot', text: '左侧细轨，悬停出预览卡，点击跳到对应轮次。键盘也能上下走。' },
      ]},
      { id: 's2', ws: 'shengchang', title: '审查栏对齐', messages: [
        { role: 'user', text: '右侧审查栏按 Codex 密度收一下。' },
        { role: 'bot', text: '变更 / 本轮产出 / 任务三块已经按空态铺好，文件行点开就能看。' },
      ]},
      { id: 's3', ws: 'ungrouped', title: 'Codex 壳预览', messages: [
        { role: 'user', text: '对话页顶部按 Codex 做圆角裁剪。' },
        { role: 'bot', text: '主栏做成内缩圆角卡片，标题栏按键都接上了。' },
      ]},
    ]
    let groupBy = 'workspace'
    let orderBy = 'updated'
    let activeSid = ''
    let currentWs = 'ungrouped'
    const paintList = () => {
      slabel.textContent = groupBy === 'workspace' ? '工作区' : (orderBy === 'updated' ? '最近' : '会话')
      const q = sessQ.value.trim().toLowerCase()
      const rows = sessions.filter(s => !q || s.title.toLowerCase().includes(q))
      if (!rows.length) {
        slist.innerHTML = '<div class="sempty">' + (q ? '无匹配会话' : '暂无会话') + '</div>'
        return
      }
      const mkRow = (s) => {
        const b = document.createElement('button')
        b.className = 'srow' + (s.id === activeSid ? ' on' : '')
        b.type = 'button'
        b.textContent = s.title
        const x = document.createElement('button')
        x.className = 'xrow'
        x.type = 'button'
        x.setAttribute('aria-label', '归档会话')
        x.textContent = '×'
        x.onclick = (e) => {
          e.stopPropagation()
          const i = sessions.findIndex(x => x.id === s.id)
          if (i >= 0) sessions.splice(i, 1)
          if (activeSid === s.id) activeSid = sessions[0] ? sessions[0].id : ''
          paintList()
        }
        b.appendChild(x)
        b.onclick = () => { openSession(s.id) }
        return b
      }
      slist.innerHTML = ''
      if (q || groupBy === 'flat') {
        rows.forEach(s => slist.appendChild(mkRow(s)))
        return
      }
      workspaces.forEach(ws => {
        const kids = rows.filter(s => s.ws === ws.id)
        const g = document.createElement('div')
        g.className = 'wsg' + (ws.open ? '' : ' shut')
        const h = document.createElement('button')
        h.className = 'wsh'
        h.type = 'button'
        h.innerHTML = '<span class="chev">▾</span><span>' + ws.name + '</span>'
        h.onclick = () => { ws.open = !ws.open; paintList() }
        const box = document.createElement('div')
        box.className = 'srows'
        kids.forEach(s => box.appendChild(mkRow(s)))
        if (!kids.length) {
          const empty = document.createElement('div')
          empty.className = 'sempty'
          empty.textContent = '暂无会话'
          box.appendChild(empty)
        }
        g.appendChild(h)
        g.appendChild(box)
        slist.appendChild(g)
      })
    }
    const openSearch = () => {
      document.getElementById('brand').classList.add('searching')
      sessQ.focus()
    }
    const closeSearch = () => {
      sessQ.value = ''
      document.getElementById('brand').classList.remove('searching')
      paintList()
    }
    document.getElementById('btnSearch').onclick = (e) => { e.stopPropagation(); openSearch() }
    document.getElementById('btnSearchX').onclick = (e) => { e.stopPropagation(); closeSearch() }
    sessQ.addEventListener('input', paintList)
    sessQ.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSearch() })
    document.getElementById('btnView').onclick = (e) => {
      e.stopPropagation()
      const pop = document.getElementById('popViewOpts')
      if (pop.classList.contains('show')) hideBarPops()
      else showPop('popViewOpts', e.currentTarget)
    }
    document.querySelectorAll('#popViewOpts button').forEach(b => {
      b.onclick = () => {
        if (b.dataset.g) groupBy = b.dataset.g
        if (b.dataset.o) orderBy = b.dataset.o
        hideBarPops()
        paintList()
      }
    })
    document.getElementById('btnAddWs').onclick = async () => {
      hideBarPops()
      let name = '新工作区'
      if (window.showDirectoryPicker) {
        try { name = (await window.showDirectoryPicker()).name } catch { return }
      }
      if (workspaces.some(w => w.name === name)) return
      workspaces.splice(workspaces.length - 1, 0, { id: 'ws-' + Date.now(), name, open: true })
      paintList()
    }
    const openPlugins = () => {
      openSettings()
      document.querySelector('[data-p="p"]').click()
    }
    document.getElementById('openPlugins').onclick = openPlugins
    const setProjectLabel = (name) => {
      const label = document.getElementById('btnProject')
      const text = [...label.childNodes].find(n => n.nodeType === 3 && n.textContent.trim())
      if (text) text.textContent = '\n            ' + name + '\n            '
    }
    const paintThread = () => {
      const s = sessions.find(x => x.id === activeSid)
      thread.innerHTML = ''
      if (!s || !s.messages.length) {
        hero.classList.remove('chat')
        return
      }
      hero.classList.add('chat')
      s.messages.forEach(m => {
        const d = document.createElement('div')
        d.className = 'bubble ' + m.role
        d.textContent = m.text
        thread.appendChild(d)
      })
      thread.scrollTop = thread.scrollHeight
    }
    const openSession = (id) => {
      activeSid = id
      const s = sessions.find(x => x.id === id)
      if (s) {
        currentWs = s.ws
        const ws = workspaces.find(w => w.id === s.ws)
        if (ws) setProjectLabel(ws.name)
      }
      paintThread()
      paintList()
      closeSettings()
    }
    const commitSend = () => {
      const text = draft.value.trim()
      if (!text) return
      let s = sessions.find(x => x.id === activeSid)
      if (!s) {
        s = { id: 's' + Date.now(), ws: currentWs, title: text.slice(0, 18), messages: [] }
        sessions.unshift(s)
        activeSid = s.id
      } else if (!s.messages.length) {
        s.title = text.slice(0, 18)
      }
      s.messages.push({ role: 'user', text })
      s.messages.push({ role: 'bot', text: '已记下。继续说就行。' })
      draft.value = ''
      send.disabled = true
      paintThread()
      paintList()
    }
    send.onclick = commitSend
    draft.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return
      if (prefs.enter === '1' || ((e.ctrlKey || e.metaKey) && prefs.enter === '0')) {
        e.preventDefault()
        commitSend()
      }
    })
    const paintProjectPop = () => {
      const pop = document.getElementById('popProject')
      pop.innerHTML = ''
      workspaces.forEach(ws => {
        const b = document.createElement('button')
        b.type = 'button'
        b.textContent = ws.name
        b.onclick = () => {
          currentWs = ws.id
          setProjectLabel(ws.name)
          hideBarPops()
          const first = sessions.find(s => s.ws === ws.id)
          if (first) openSession(first.id)
          else { newChat(); paintList() }
        }
        pop.appendChild(b)
      })
    }
    document.getElementById('btnProject').onclick = (e) => {
      e.stopPropagation()
      paintProjectPop()
      const pop = document.getElementById('popProject')
      if (pop.classList.contains('show')) hideBarPops()
      else showPop('popProject', e.currentTarget)
    }
    const addSession = () => {
      newChat()
      const n = sessions.filter(s => s.title.startsWith('新会话')).length
      const s = { id: 's' + Date.now(), ws: currentWs, title: n ? '新会话 ' + (n + 1) : '新会话', messages: [] }
      sessions.unshift(s)
      activeSid = s.id
      paintList()
    }
    document.getElementById('btnNew').onclick = addSession
    paintList()
    paintNav()

    document.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase()
      if ((e.ctrlKey || e.metaKey) && k === ',') { e.preventDefault(); openSettings() }
      if ((e.ctrlKey || e.metaKey) && k === 'b') { e.preventDefault(); toggleSide() }
      if ((e.ctrlKey || e.metaKey) && k === 'n') { e.preventDefault(); addSession() }
      if (e.key === 'F11') { e.preventDefault(); toggleMax() }
      if ((e.ctrlKey || e.metaKey) && (e.key === '=' || e.key === '+')) { e.preventDefault(); zoomBy(0.1) }
      if ((e.ctrlKey || e.metaKey) && e.key === '-') { e.preventDefault(); zoomBy(-0.1) }
      if ((e.ctrlKey || e.metaKey) && e.key === '0') { e.preventDefault(); z = 1; applyZoom() }
      if ((e.ctrlKey || e.metaKey) && k === 'w') { e.preventDefault(); closeWin() }
      if ((e.ctrlKey || e.metaKey) && k === 'q') { e.preventDefault(); closeWin() }
      if (e.key === 'Escape') {
        if (about.classList.contains('show')) hideAbout()
        else if (keys.classList.contains('show')) hideKeys()
        else if (o.classList.contains('show')) closeSettings()
        else if (document.getElementById('brand').classList.contains('searching')) closeSearch()
        else hideBarPops()
      }
    })

    if (location.hash === '#search') openSearch()
    if (location.hash === '#chat') openSession('s1')
    if (location.hash === '#settings' || location.hash === '#plugins' || location.hash === '#shortcuts') openSettings()
    if (location.hash === '#shortcuts') document.querySelector('[data-p="k"]').click()
    if (location.hash === '#plugins') document.querySelector('[data-p="p"]').click()
    if (location.hash === '#model') { menu.classList.add('show'); btn.classList.add('open') }
    if (location.hash === '#preset') { pmenu.classList.add('show'); pbtn.classList.add('open') }
    if (location.hash === '#file') showPop('popFile', document.getElementById('mFile'))
    if (location.hash === '#view') showPop('popView', document.getElementById('mView'))
    if (location.hash === '#edit') showPop('popEdit', document.getElementById('mEdit'))
    if (location.hash === '#help') showPop('popHelp', document.getElementById('mHelp'))
    if (location.hash === '#about') showAbout()
  </script>
</body>
</html>
